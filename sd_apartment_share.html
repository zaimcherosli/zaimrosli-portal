<script>

const coFormLogin_Phone = document.getElementById('FormLogin_Phone');



const coFormLogin = document.getElementById( 'FormLogin' );



const coFormLogin_Pwd = document.getElementById( 'FormLogin_Pwd' );

const coFormLoginPwdToggler = document.getElementById( 'FormLoginPwdToggler' );



const coBtnSubmitFormLogin = document.getElementById( 'BtnSubmitFormLogin' );





coFormLoginPwdToggler.addEventListener( 'click', ( oEvent ) => {

					

	fFormLoginPwdToggler( oEvent );

	

});



function fFormLoginPwdToggler ( oEvent ) {



	if ( coFormLogin.elements['pwd'].type == 'password'){

		

		coFormLogin.elements['pwd'].type = 'text';

		coFormLoginPwdToggler.getElementsByTagName('i')[0].classList.remove('fa-eye-slash');

		coFormLoginPwdToggler.getElementsByTagName('i')[0].classList.add('fa-eye');

		

	}

	else {

		

		coFormLogin.elements['pwd'].type = 'password';

		coFormLoginPwdToggler.getElementsByTagName('i')[0].classList.remove('fa-eye');

		coFormLoginPwdToggler.getElementsByTagName('i')[0].classList.add('fa-eye-slash');

		

	}





}



coBtnSubmitFormLogin.addEventListener( 'click', () => {

	if (

		coFormLogin_Phone.value == ''

	){

		coFormLogin_Phone.classList.add('form-input-error');

	}



	if(

		coFormLogin_Pwd.value == ''

	){



		coFormLogin_Pwd.classList.add('form-input-error');



	}



});







coFormLogin_Phone.addEventListener( 'click', function( oEvent ){



	coFormLogin_Phone.classList.remove('form-input-error');

	

});



coFormLogin_Phone.addEventListener( 'keydown', function( oEvent ){



	coFormLogin_Phone.classList.remove('form-input-error');

	

});



coFormLogin_Pwd.addEventListener( 'click', function( oEvent ){



	coFormLogin_Pwd.classList.remove('form-input-error');

	

});



coFormLogin_Pwd.addEventListener( 'keydown', function( oEvent ){



	coFormLogin_Pwd.classList.remove('form-input-error');

	

});





coFormLogin.addEventListener( 'submit', function( oEvent ){



	if(

		coFormLogin_Pwd.value == ''

	){



		coFormLogin_Pwd.classList.add('form-input-error');



	}



	const coBtnSubmitFormLogin = document.getElementById( 'BtnSubmitFormLogin' );



	coBtnSubmitFormLogin.innerHTML = '<i>Please wait...</i>';

	coBtnSubmitFormLogin.disabled = true;



} );



</script>
